<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iMuslim – Artikel Muslim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f7ff;--surface:#fff;--ink:#14213d;--muted:#5b6785;--blue:#2563eb;--blue2:#1d4ed8;--pink:#ec4899;--pink-soft:#fde4f1;--blue-soft:#dbe7ff;--line:#d9e2f5;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1224;--surface:#151d38;--ink:#eaf0ff;--muted:#9aa8cc;--blue:#6b9cff;--blue2:#8fb3ff;--pink:#ff6fb5;--pink-soft:#3a1730;--blue-soft:#1b2a55;--line:#26335f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1224;--surface:#151d38;--ink:#eaf0ff;--muted:#9aa8cc;--blue:#6b9cff;--blue2:#8fb3ff;--pink:#ff6fb5;--pink-soft:#3a1730;--blue-soft:#1b2a55;--line:#26335f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Nunito,system-ui,sans-serif;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--pink)}
.bar{max-width:1080px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:28px;font-weight:800;color:var(--blue);text-decoration:none}.logo b{color:var(--pink)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
nav a:hover{background:var(--blue-soft)}nav a.on{background:var(--blue);color:#fff}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:700;background:var(--blue);color:#fff}
.btn.pink{background:var(--pink);color:#fff}.btn.ghost{background:var(--blue-soft);color:var(--blue2)}.btn.del{background:var(--pink-soft);color:var(--pink)}
.btn.sm{padding:5px 12px;font-size:14px}
.icon{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:50%;width:40px;height:40px;font-size:18px}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
main{max-width:1080px;margin:auto;padding:24px 16px 60px}
.hero{background:linear-gradient(120deg,var(--blue),var(--pink));color:#fff;border-radius:22px;padding:34px 28px;margin-bottom:28px}
.hero h1{font-size:clamp(28px,5vw,44px)}.hero p{margin:10px 0 0;max-width:56ch;opacity:.95}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h2{font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--blue-soft),var(--pink-soft));background-size:cover;background-position:center;cursor:pointer}
.card .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{align-self:flex-start;font-size:13px;font-weight:700;background:var(--pink-soft);color:var(--pink);padding:2px 10px;border-radius:999px}
.card h3{font-size:19px;cursor:pointer}.card h3:hover{color:var(--blue)}
.card p{margin:0;color:var(--muted);font-size:15px}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.empty{padding:40px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
article{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:820px;margin:auto}
article h1{font-size:clamp(26px,4vw,38px);margin:10px 0 16px}
article .main{width:100%;max-height:440px;object-fit:cover;border-radius:14px}
.body{white-space:pre-wrap;margin:18px 0;max-width:68ch}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gal img{width:100%;border-radius:12px;aspect-ratio:4/3;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(10,15,35,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:20px 12px}
.ov.show{display:flex}
.modal{background:var(--surface);border-radius:18px;padding:22px;width:100%;max-width:560px;margin:auto}
.modal h2{font-size:24px;margin-bottom:14px}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:15px}
input[type=text],input[type=password],select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:160px;resize:vertical}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.prev div{position:relative}.prev img{width:84px;height:64px;object-fit:cover;border-radius:8px}
.prev button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--pink);color:#fff;line-height:1}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.err{color:var(--pink);font-weight:700;margin:8px 0 0;min-height:1.2em}
footer{text-align:center;color:var(--muted);padding:20px;border-top:1px solid var(--line);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#beranda">i<b>Muslim</b></a>
<nav id="nav">
<a href="#beranda" data-k="beranda">Beranda</a>
<a href="#adab" data-k="adab">Adab dan Akhlaq</a>
<a href="#fiqih" data-k="fiqih">Fiqih</a>
<a href="#muslimah" data-k="muslimah">Muslimah</a>
</nav>
<button class="icon" id="theme" aria-label="Ganti tema siang atau malam" title="Siang / Malam">🌙</button>
<button class="btn pink" id="auth">Login Admin</button>
</div></header>

<main id="app"></main>
<footer>© iMuslim – belajar, beradab, berilmu</footer>

<div class="ov" id="ovLogin"><div class="modal">
<h2>Login admin</h2>
<label for="u">Username</label><input type="text" id="u" autocomplete="username">
<label for="p">Password</label><input type="password" id="p" autocomplete="current-password">
<p class="err" id="lerr"></p>
<div class="row"><button class="btn ghost" data-close>Batal</button><button class="btn" id="doLogin">Masuk</button></div>
</div></div>

<div class="ov" id="ovForm"><div class="modal">
<h2 id="ftitle">Tambah artikel</h2>
<label for="fj">Judul artikel</label><input type="text" id="fj">
<label for="fk">Kategori</label>
<select id="fk"><option value="adab">Adab dan Akhlaq</option><option value="fiqih">Fiqih</option><option value="muslimah">Muslimah</option></select>
<label for="ff">Foto utama</label><input type="file" id="ff" accept="image/*">
<div class="prev" id="pm"></div>
<label for="fd">Detail artikel</label><textarea id="fd"></textarea>
<label for="fs">Foto pendukung (boleh lebih dari satu)</label><input type="file" id="fs" accept="image/*" multiple>
<div class="prev" id="ps"></div>
<p class="err" id="ferr"></p>
<div class="row"><button class="btn ghost" data-close>Batal</button><button class="btn" id="save">Simpan artikel</button></div>
</div></div>

<script>
var KEY='imuslim_articles_v1', TKEY='imuslim_theme';
var CATS={adab:'Adab dan Akhlaq',fiqih:'Fiqih',muslimah:'Muslimah'};
var ADMIN_USER='Azzalea Latieshia Agatha', ADMIN_PASS='446';
var seed=[
{id:'a1',cat:'adab',title:'Adab kepada kedua orang tua',main:'',extra:[],body:'Berbakti kepada orang tua adalah salah satu amalan yang sangat dimuliakan dalam Islam.\n\nBeberapa adab yang bisa kita jaga: berbicara dengan lembut, tidak membentak, menaati perintah selama bukan dalam maksiat, mendoakan mereka, dan membantu kebutuhan mereka sebisa mungkin.\n\nBerbakti tidak berhenti ketika mereka sudah tua atau telah tiada. Doa dan sedekah atas nama mereka tetap menjadi bentuk bakti.'},
{id:'a2',cat:'fiqih',title:'Tata cara wudu yang benar',main:'',extra:[],body:'Wudu adalah syarat sahnya salat. Rukunnya meliputi niat, membasuh wajah, membasuh kedua tangan sampai siku, mengusap sebagian kepala, membasuh kedua kaki sampai mata kaki, dan tertib.\n\nSunnahnya antara lain membaca basmalah, bersiwak, berkumur, memasukkan air ke hidung, dan mengulang basuhan hingga tiga kali.\n\nUntuk rincian sesuai mazhab, tanyakan kepada ustaz atau guru yang terpercaya.'},
{id:'a3',cat:'muslimah',title:'Menjaga rasa malu sebagai perhiasan muslimah',main:'',extra:[],body:'Rasa malu adalah bagian dari iman. Seorang muslimah yang menjaga rasa malunya akan terjaga dalam ucapan, pakaian, dan pergaulan.\n\nMenutup aurat, menjaga pandangan, dan berhati-hati di media sosial adalah bentuk nyata dari rasa malu tersebut, tanpa menghalangi muslimah untuk menuntut ilmu dan berkarya.'}
];
var arts=[], admin=false, editId=null, fMain='', fExtra=[];
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
try{admin=sessionStorage.getItem('imuslim_admin')==='1'}catch(e){}
(function(){var r=sget(KEY);try{arts=r?JSON.parse(r):seed}catch(e){arts=seed}if(!Array.isArray(arts))arts=seed})();
function persist(){if(!sset(KEY,JSON.stringify(arts))){alert('Penyimpanan penuh. Gunakan foto yang lebih kecil atau hapus artikel lama.');return false}return true}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* Tema */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);$('theme').textContent=t==='dark'?'☀️':'🌙'}
(function(){var t=sget(TKEY);if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';applyTheme(t)})();
$('theme').onclick=function(){var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(t);sset(TKEY,t)};

/* Tampilan */
function card(a){
 var st=a.main?' style="background-image:url('+a.main+')"':'';
 var ad=admin?'<div class="acts"><button class="btn ghost sm" data-edit="'+a.id+'">Edit</button><button class="btn del sm" data-del="'+a.id+'">Hapus</button></div>':'';
 var ex=a.body.replace(/\s+/g,' ').slice(0,110)+(a.body.length>110?'…':'');
 return '<div class="card"><div class="thumb" data-open="'+a.id+'"'+st+'></div><div class="in"><span class="tag">'+CATS[a.cat]+'</span><h3 data-open="'+a.id+'">'+esc(a.title)+'</h3><p>'+esc(ex)+'</p>'+ad+'</div></div>';
}
function render(){
 var h=(location.hash||'#beranda').slice(1), app=$('app'), key=h;
 $('auth').textContent=admin?'Logout ('+'Admin)':'Login Admin';
 if(h.indexOf('artikel-')===0){
  var a=arts.filter(function(x){return 'artikel-'+x.id===h})[0];
  key=a?a.cat:'beranda';
  if(a){
   var g=a.extra.map(function(s){return '<img src="'+s+'" alt="Foto pendukung">'}).join('');
   app.innerHTML='<article><a href="#'+a.cat+'" class="btn ghost sm" style="text-decoration:none;display:inline-block">← Kembali</a><br><span class="tag" style="margin-top:12px;display:inline-block">'+CATS[a.cat]+'</span><h1>'+esc(a.title)+'</h1>'+(a.main?'<img class="main" src="'+a.main+'" alt="Foto utama">':'')+'<div class="body">'+esc(a.body)+'</div>'+(g?'<h3 style="margin-bottom:10px">Foto pendukung</h3><div class="gal">'+g+'</div>':'')+(admin?'<div class="acts" style="margin-top:18px"><button class="btn ghost" data-edit="'+a.id+'">Edit</button><button class="btn del" data-del="'+a.id+'">Hapus</button></div>':'')+'</article>';
   mark(key);return;
  }
 }
 if(!CATS[h])h='beranda';
 var list=h==='beranda'?arts:arts.filter(function(x){return x.cat===h});
 var title=h==='beranda'?'Artikel terbaru':CATS[h];
 var hero=h==='beranda'?'<section class="hero"><h1>Belajar Islam dengan tenang dan terarah</h1><p>Kumpulan artikel tentang adab dan akhlaq, fiqih, serta kajian untuk muslimah.</p></section>':'';
 var add=admin?'<button class="btn pink" id="add">+ Tambah artikel</button>':'';
 app.innerHTML=hero+'<div class="top"><h2>'+title+'</h2>'+add+'</div>'+(list.length?'<div class="grid">'+list.slice().reverse().map(card).join('')+'</div>':'<div class="empty">Belum ada artikel di kategori ini.'+(admin?' Klik “Tambah artikel” untuk membuat yang pertama.':'')+'</div>');
 mark(h);
}
function mark(k){[].forEach.call(document.querySelectorAll('#nav a'),function(a){a.classList.toggle('on',a.dataset.k===k)})}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});

/* Klik */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-open],[data-edit],[data-del],[data-close],#add');if(!t)return;
 if(t.dataset.open)location.hash='artikel-'+t.dataset.open;
 else if(t.dataset.edit)openForm(t.dataset.edit);
 else if(t.dataset.del){if(admin&&confirm('Hapus artikel ini?')){arts=arts.filter(function(x){return x.id!==t.dataset.del});persist();if(location.hash.indexOf('artikel-')===1)location.hash='beranda';render()}}
 else if(t.id==='add')openForm(null);
 else if(t.dataset.close!==undefined)document.querySelectorAll('.ov').forEach(function(o){o.classList.remove('show')});
});

/* Login */
$('auth').onclick=function(){
 if(admin){admin=false;try{sessionStorage.removeItem('imuslim_admin')}catch(e){}render();return}
 $('u').value='';$('p').value='';$('lerr').textContent='';$('ovLogin').classList.add('show');$('u').focus();
};
function doLogin(){
 if($('u').value.trim()===ADMIN_USER&&$('p').value===ADMIN_PASS){
  admin=true;try{sessionStorage.setItem('imuslim_admin','1')}catch(e){}
  $('ovLogin').classList.remove('show');render();
 }else $('lerr').textContent='Username atau password salah.';
}
$('doLogin').onclick=doLogin;
$('p').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});

/* Form artikel */
function shrink(file){return new Promise(function(res,rej){
 var r=new FileReader();r.onerror=rej;
 r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
  var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};
 r.readAsDataURL(file)})}
function prevs(){
 $('pm').innerHTML=fMain?'<div><img src="'+fMain+'" alt=""></div>':'';
 $('ps').innerHTML=fExtra.map(function(s,i){return '<div><img src="'+s+'" alt=""><button type="button" data-rm="'+i+'" aria-label="Hapus foto">×</button></div>'}).join('');
}
$('ps').addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(b){fExtra.splice(+b.dataset.rm,1);prevs()}});
$('ff').onchange=function(){var f=this.files[0];if(f)shrink(f).then(function(d){fMain=d;prevs()}).catch(function(){$('ferr').textContent='Foto tidak bisa dibaca.'})};
$('fs').onchange=function(){var fs=[].slice.call(this.files);Promise.all(fs.map(shrink)).then(function(ds){fExtra=fExtra.concat(ds);prevs()}).catch(function(){$('ferr').textContent='Foto tidak bisa dibaca.'});this.value=''};
function openForm(id){
 if(!admin)return;editId=id;var a=id?arts.filter(function(x){return x.id===id})[0]:null;
 $('ftitle').textContent=a?'Edit artikel':'Tambah artikel';
 $('fj').value=a?a.title:'';$('fk').value=a?a.cat:'adab';$('fd').value=a?a.body:'';
 fMain=a?a.main:'';fExtra=a?a.extra.slice():[];$('ff').value='';$('ferr').textContent='';prevs();
 $('ovForm').classList.add('show');
}
$('save').onclick=function(){
 var t=$('fj').value.trim(),d=$('fd').value.trim();
 if(!t||!d){$('ferr').textContent='Judul dan detail artikel wajib diisi.';return}
 var o={id:editId||('a'+Date.now()),cat:$('fk').value,title:t,main:fMain,extra:fExtra,body:d};
 var old=arts.slice();
 if(editId)arts=arts.map(function(x){return x.id===editId?o:x});else arts.push(o);
 if(!persist()){arts=old;return}
 $('ovForm').classList.remove('show');
 if(editId&&location.hash.indexOf('artikel-')!==1)render();else location.hash=editId?'artikel-'+editId:o.cat;
 render();
};
render();
</script>
</body>
</html>
